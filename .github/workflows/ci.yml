name: production-safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r app/requirements.txt -r requirements-dev.txt
      - run: ruff check app scripts tests
      - run: PYTHONPATH=app pytest -q
      - name: Enforce append-only Chroma policy
        run: '! grep -R -E "collection\.delete|target\.delete|\.delete\(where" app scripts'
      - run: pip check
      - run: pip-audit -r app/requirements.txt
      - run: docker build --target test -t here-i-am-test .
      - run: docker run --rm here-i-am-test

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
