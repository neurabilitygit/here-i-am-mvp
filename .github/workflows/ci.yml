name: production-safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r app/requirements.txt -r requirements-dev.txt
      - run: ruff check app scripts tests
      - run: PYTHONPATH=app pytest -q
      - name: Enforce append-only Chroma policy
        run: '! grep -R -E "collection\.delete|target\.delete|\.delete\(where" app scripts'
      - run: pip check
      # These no-fix advisories affect Chroma's network server and multi-tenant
      # authorization. Here I Am uses only the embedded PersistentClient. See
      # docs/SECURITY_EXCEPTIONS.md; static tests enforce that boundary.
      - run: pip-audit -r app/requirements.txt --ignore-vuln PYSEC-2026-3813 --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815
      - run: docker build --target test -t here-i-am-test .
      - run: docker run --rm here-i-am-test

  browser-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r app/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run test:browser

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
